<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Manajemen Produk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class', // Aktifkan mode gelap dengan kelas 'dark'
            theme: {
                extend: {},
            },
        }
    </script>
</head>

<body class="bg-gray-100 dark:bg-gray-900 min-h-screen transition-colors duration-500">

    <!-- Header -->
    <header class="flex justify-between items-center px-6 py-4 bg-white dark:bg-gray-800 shadow-md">
        <h1 class="text-2xl font-bold text-red-600 dark:text-white">Sistem Manajemen Produk</h1>
        <button id="toggleDark" class="bg-gray-200 dark:bg-gray-700 p-2 rounded-full transition hover:scale-110">
            🌙
        </button>
    </header>

    <div class="p-6 flex flex-col items-center gap-8">

        <!-- Form Tambah Produk -->
        <div
            class="bg-white dark:bg-gray-800 shadow-lg rounded-2xl p-6 w-full max-w-md border-t-4 border-red-600 dark:border-red-400">
            <h2 class="text-xl font-semibold text-gray-800 dark:text-gray-200 mb-4">Tambah Produk</h2>
            <div class="space-y-3">
                <input id="nama" type="text" placeholder="Nama Produk"
                    class="w-full p-3 border rounded-xl dark:bg-gray-700 dark:text-white dark:border-gray-600 focus:ring-2 focus:ring-red-400 transition">
                <input id="harga" type="number" placeholder="Harga"
                    class="w-full p-3 border rounded-xl dark:bg-gray-700 dark:text-white dark:border-gray-600 focus:ring-2 focus:ring-red-400 transition">
                <input id="stok" type="number" placeholder="Stok"
                    class="w-full p-3 border rounded-xl dark:bg-gray-700 dark:text-white dark:border-gray-600 focus:ring-2 focus:ring-red-400 transition">
                <button onclick="tambahProduk()"
                    class="w-full bg-red-600 hover:bg-red-700 dark:bg-red-500 dark:hover:bg-red-600 text-white font-semibold py-3 rounded-xl transition">
                    ➕ Tambah Produk
                </button>
            </div>
        </div>

        <!-- Daftar Produk -->
        <div class="w-full max-w-4xl">
            <h2 class="text-xl font-semibold text-gray-800 dark:text-gray-200 mb-4">Daftar Produk</h2>
            <div id="produkList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>

    </div>

    <!-- Card Konfirmasi Hapus -->
    <div id="confirmCard"
        class="fixed inset-0 bg-black bg-opacity-50 hidden justify-center items-center z-50 transition">
        <div
            class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-lg max-w-sm w-full text-center space-y-4 border-t-4 border-red-600 dark:border-red-400">
            <h3 class="text-lg font-semibold text-gray-800 dark:text-gray-200">Konfirmasi Hapus</h3>
            <p class="text-gray-600 dark:text-gray-400">Apakah Anda yakin ingin menghapus produk ini?</p>
            <div class="flex justify-center gap-4">
                <button id="batalBtn"
                    class="px-4 py-2 rounded-xl bg-gray-300 hover:bg-gray-400 dark:bg-gray-600 dark:hover:bg-gray-500 text-gray-800 dark:text-gray-200 transition">Tidak</button>
                <button id="hapusBtn"
                    class="px-4 py-2 rounded-xl bg-red-600 hover:bg-red-700 dark:bg-red-500 dark:hover:bg-red-600 text-white transition">Ya</button>
            </div>
        </div>
    </div>

    <script>
        // Dark mode toggle button 
        const html = document.documentElement;
        document.getElementById("toggleDark").addEventListener("click", () => {
            html.classList.toggle("dark");
        });

        // Data awal produk toko
        let produkToko = [
            { id: 1, nama: "Laptop", harga: 7000000, stok: 5 },
            { id: 2, nama: "Mouse", harga: 200000, stok: 10 },
            { id: 3, nama: "Keyboard", harga: 350000, stok: 7 }
        ];

        // Variabel untuk simpan ID produk yang mau dihapus
        let produkHapusId = null;

        // Menampilkan daftar produk
        function tampilkanProduk() {
            const list = document.getElementById("produkList");
            list.innerHTML = "";
            produkToko.forEach(produk => {
                list.innerHTML += `
            <div class="bg-white dark:bg-gray-800 shadow-md rounded-2xl p-5 flex flex-col justify-between transition hover:shadow-xl hover:scale-[1.02]">
                <div>
                <h3 class="text-lg font-bold text-gray-800 dark:text-gray-200">${produk.nama}</h3>
                <p class="text-gray-600 dark:text-gray-400">Harga: Rp ${produk.harga.toLocaleString("id-ID")}</p>
                <p class="text-gray-600 dark:text-gray-400">Stok: ${produk.stok}</p>
                </div>
                <button onclick="konfirmasiHapus(${produk.id})" class="mt-4 bg-red-600 hover:bg-red-700 dark:bg-red-500 dark:hover:bg-red-600 text-white px-4 py-2 rounded-xl transition">
                🗑 Hapus
                </button>
            </div>
            `;
            });
        }

        // Menampilkan card konfirmasi
        function konfirmasiHapus(id) {
            produkHapusId = id;
            document.getElementById("confirmCard").classList.remove("hidden");
            document.getElementById("confirmCard").classList.add("flex");
        }

        // Tutup card konfirmasi
        function tutupCard() {
            document.getElementById("confirmCard").classList.add("hidden");
            document.getElementById("confirmCard").classList.remove("flex");
            produkHapusId = null;
        }

        // Aksi tombol pada card konfirmasi
        document.getElementById("batalBtn").addEventListener("click", tutupCard);
        document.getElementById("hapusBtn").addEventListener("click", () => {
            if (produkHapusId !== null) { 
                produkToko = produkToko.filter(produk => produk.id !== produkHapusId);
                tampilkanProduk();
                tutupCard();
            }
        });

        // Menambahkan produk baru
        function tambahProduk() {
            const nama = document.getElementById("nama").value;
            const harga = parseInt(document.getElementById("harga").value);
            const stok = parseInt(document.getElementById("stok").value);

            if (nama && harga && stok) {
                const newId = produkToko.length ? produkToko[produkToko.length - 1].id + 1 : 1;
                produkToko.push({ id: newId, nama, harga, stok });
                tampilkanProduk();
                document.getElementById("nama").value = "";
                document.getElementById("harga").value = "";
                document.getElementById("stok").value = "";
            } else {
                alert("Harap isi semua data produk!");
            }
        }

        // Tampilkan data awal
        tampilkanProduk();
    </script>
</body>

</html>
