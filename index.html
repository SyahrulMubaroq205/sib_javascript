<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tugas 1 - Menghitung Luas (JavaScript)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h1,
        h2 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input,
        select,
        button {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #45a049;
        }

        .hidden {
            display: none;
        }

        #resultsCard {
            max-width: 400px;
            margin: 20px auto;
            padding: 16px;
            border: 1px solid #4CAF50;
            border-radius: 10px;
            background: #f9fff9;
            display: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Tugas 1 - Menghitung Luas</h1>
        <p>Masukkan nilai sisi, panjang, lebar, alas, dan tinggi untuk menghitung luas dari berbagai bangun.</p>

        <div class="card">
            <h2>Hitung Luas Bangun Datar</h2>
            
            <!-- Select Bangun Datar -->
            <label for="shape">Pilih Bangun:</label>
            <select id="shape" onchange="showInputs()">
                <option value="">-- Pilih --</option>
                <option value="rect">Persegi Panjang</option>
                <option value="square">Bujur Sangkar</option>
                <option value="tri">Segitiga</option>
            </select>

            <!-- Persegi panjang -->
            <div id="rectInputs" class="hidden">
                <label>Panjang:</label>
                <input type="number" id="rectLength" placeholder="Masukkan panjang">
                <label>Lebar:</label>
                <input type="number" id="rectWidth" placeholder="Masukkan lebar">
            </div>

            <!-- Bujur sangkar -->
            <div id="squareInputs" class="hidden">
                <label>Sisi:</label>
                <input type="number" id="squareSide" placeholder="Masukkan sisi">
            </div>

            <!-- Segitiga -->
            <div id="triInputs" class="hidden">
                <label>Alas:</label>
                <input type="number" id="triBase" placeholder="Masukkan alas">
                <label>Tinggi:</label>
                <input type="number" id="triHeight" placeholder="Masukkan tinggi">
            </div>

            <button onclick="calculateAreas()">Hitung Luas</button>

            <!-- Hasil -->
            <div id="resultsCard">
                <h3>Hasil Perhitungan:</h3>
                <div id="results"></div>
            </div>
        </div>


        <script>
            // Fungsi menghitung luas persegi panjang
            function areaRectangle(length, width) {
                return length * width;
            }

            // Fungsi menghitung luas bujur sangkar
            function areaSquare(side) {
                return side * side;
            }

            // Fungsi menghitung luas segitiga
            function areaTriangle(base, height) {
                return 0.5 * base * height;
            }

            // Menampilkan input sesuai pilihan bangun
            function showInputs() {
                const shape = document.getElementById('shape').value;
                document.getElementById('rectInputs').classList.add('hidden');
                document.getElementById('squareInputs').classList.add('hidden');
                document.getElementById('triInputs').classList.add('hidden');

                // reset hasil setiap kali ganti pilihan
                document.getElementById('resultsCard').style.display = 'none';
                document.getElementById('results').innerHTML = '';

                if (shape === 'rect') {
                    document.getElementById('rectInputs').classList.remove('hidden');
                } else if (shape === 'square') {
                    document.getElementById('squareInputs').classList.remove('hidden');
                } else if (shape === 'tri') {
                    document.getElementById('triInputs').classList.remove('hidden');
                }
            }

            // Fungsi utama untuk menghitung luas berdasarkan input
            function calculateAreas() {
                const shape = document.getElementById('shape').value;
                let result = 0;
                let text = '';

                if (shape === 'rect') {
                    const length = parseFloat(document.getElementById('rectLength').value || 0);
                    const width = parseFloat(document.getElementById('rectWidth').value || 0);
                    result = areaRectangle(length, width);
                    text = `
                Bangun: Persegi Panjang<br>
                Panjang: ${length}<br>
                Lebar: ${width}<br>
                Luas: ${result} cm²
            `;
                } else if (shape === 'square') {
                    const side = parseFloat(document.getElementById('squareSide').value || 0);
                    result = areaSquare(side);
                    text = `
                Bangun: Bujur Sangkar<br>
                Sisi: ${side}<br>
                Luas: ${result} cm²
            `;
                } else if (shape === 'tri') {
                    const base = parseFloat(document.getElementById('triBase').value || 0);
                    const height = parseFloat(document.getElementById('triHeight').value || 0);
                    result = areaTriangle(base, height);
                    text = `
                Bangun: Segitiga<br>
                Alas: ${base}<br>
                Tinggi: ${height}<br>
                Luas: ${result} cm²
            `;
                } else {
                    text = 'Pilih bangun terlebih dahulu.';
                }

                // tampilkan hasil
                document.getElementById("results").innerHTML = `<p>${text}</p>`;
                document.getElementById('resultsCard').style.display = 'block';
            }
        </script>


</body>

</html>
