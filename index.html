<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sistem Manajemen Transportasi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --glass: rgba(255, 255, 255, 0.08);
    }

    .bg-circle-1 {
      position: absolute;
      left: -8rem;
      top: -8rem;
      width: 28rem;
      height: 28rem;
      border-radius: 9999px;
      background: radial-gradient(circle at 30% 30%, rgba(250, 204, 21, 0.6), rgba(255, 171, 145, 0.5));
      filter: blur(80px);
      transform: rotate(12deg);
      z-index: 0;
    }

    .bg-circle-2 {
      position: absolute;
      right: -8rem;
      bottom: -8rem;
      width: 28rem;
      height: 28rem;
      border-radius: 9999px;
      background: radial-gradient(circle at 70% 70%, rgba(255, 160, 180, 0.5), rgba(255, 229, 153, 0.5));
      filter: blur(80px);
      transform: rotate(-12deg);
      z-index: 0;
    }

    .bubble-front {
      position: absolute;
      z-index: 5;
      filter: blur(22px);
      opacity: 0.55;
    }

    .glass-fallback {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.02));
    }
  </style>
</head>

<body
  class="min-h-screen bg-gradient-to-br from-gray-900 via-purple-900 to-black relative overflow-hidden font-sans text-gray-100">

  <!-- background blur -->
  <div class="bg-circle-1" aria-hidden="true"></div>
  <div class="bg-circle-2" aria-hidden="true"></div>
  <div class="bubble-front left-1/4 top-1/3 w-48 h-48 rounded-full bg-yellow-200/40" style="left:20%; top:28%;"
    aria-hidden="true"></div>
  <div class="bubble-front right-1/3 top-1/4 w-36 h-36 rounded-full bg-pink-200/30" style="right:18%; top:12%;"
    aria-hidden="true"></div>

  <main class="relative z-10 min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-4xl">

      <header class="mb-6">
        <h1 class="text-3xl font-extrabold text-white">Sistem Manajemen Transportasi</h1>
        <p class="text-gray-300">Catat &amp; kelola pelanggan yang menyewa kendaraan</p>
      </header>

      <section class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <!-- FORM -->
        <div class="glass-fallback bg-black/40 backdrop-blur-md border border-white/10 rounded-2xl p-6 shadow-lg">
          <h2 class="text-xl font-semibold mb-4">Tambah Pelanggan</h2>

          <form id="form-sewa" class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-200">Nama</label>
              <input id="nama" required placeholder="Contoh: Budi Santoso"
                class="mt-1 block w-full rounded-lg border border-transparent px-3 py-2 placeholder-gray-400/60 bg-white/10 text-white focus:outline-none focus:ring-2 focus:ring-yellow-400" />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-200">Nomor Telepon</label>
              <input id="nomor" required placeholder="Contoh: 081234567890"
                class="mt-1 block w-full rounded-lg border border-transparent px-3 py-2 placeholder-gray-400/60 bg-white/10 text-white focus:outline-none focus:ring-2 focus:ring-pink-400" />
            </div>

            <!-- Dropdown kendaraan -->
            <div class="relative">
              <label class="block text-sm font-medium text-gray-200">Kendaraan yang disewa</label>

              <!-- Tombol dropdown -->
              <button id="dropdownButton" type="button"
                class="mt-1 w-full rounded-lg border border-transparent px-3 py-2 bg-white/10 text-left text-white focus:outline-none focus:ring-2 focus:ring-yellow-400 flex justify-between items-center">
                <span id="dropdownSelected" class="text-gray-400">Pilih kendaraan</span>
                <svg class="w-4 h-4 text-gray-300" fill="none" stroke="currentColor" stroke-width="2"
                  viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                </svg>
              </button>

              <!-- List pilihan -->
              <ul id="dropdownMenu"
                class="hidden absolute z-20 mt-1 w-full rounded-lg bg-black/40 backdrop-blur-md border border-white/10 text-white shadow-lg">
                <li data-value="Motor" class="px-3 py-2 hover:bg-pink-500/40 cursor-pointer rounded-t-lg">Motor</li>
                <li data-value="Sepeda" class="px-3 py-2 hover:bg-pink-500/40 cursor-pointer">Sepeda</li>
                <li data-value="Mobil" class="px-3 py-2 hover:bg-pink-500/40 cursor-pointer">Mobil</li>
                <li data-value="Pesawat" class="px-3 py-2 hover:bg-pink-500/40 cursor-pointer">Pesawat</li>
                <li data-value="Bus" class="px-3 py-2 hover:bg-pink-500/40 cursor-pointer rounded-b-lg">Bus</li>
              </ul>

              <!-- Input hidden supaya JS tetap bisa ambil value -->
              <input type="hidden" id="kendaraan" name="kendaraan" required>
            </div>

            <div class="flex items-center space-x-3">
              <button type="submit"
                class="inline-flex items-center justify-center px-4 py-2 rounded-lg bg-gradient-to-r from-yellow-400 to-pink-500 text-white font-semibold shadow hover:opacity-90">Tambah</button>
              <button id="btn-clear" type="button"
                class="px-4 py-2 rounded-lg border border-white/20 text-gray-300 hover:bg-white/10">Bersihkan</button>
            </div>
          </form>
        </div>

        <!-- DAFTAR PELANGGAN -->
        <div
          class="glass-fallback bg-black/40 backdrop-blur-md border border-white/10 rounded-2xl p-6 shadow-lg max-h-[64vh] overflow-auto">
          <h2 class="text-xl font-semibold mb-4">Daftar Pelanggan</h2>

          <div id="daftar-pelanggan" class="space-y-3"></div>
        </div>

      </section>
    </div>
  </main>

  <footer class="absolute bottom-6 left-1/2 transform -translate-x-1/2 z-10 text-xs text-gray-400">
    &copy; 2025 <span class="font-semibold text-white">Syahrul Mubaroq</span>. All rights reserved.
  </footer>

  <!-- Modal Pop-up -->
  <div id="modalOverlay" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50">
    <div id="modalBox"
      class="bg-black/50 backdrop-blur-xl border border-white/20 rounded-2xl p-6 w-96 shadow-lg text-white">
      <h3 id="modalTitle" class="text-lg font-bold mb-4">Konfirmasi</h3>
      <p id="modalMessage" class="mb-4">Apakah Anda yakin?</p>
      <div class="flex justify-end gap-2">
        <button id="modalCancel"
          class="px-4 py-2 rounded-lg bg-gray-500 hover:bg-gray-600 text-white text-sm">Batal</button>
        <button id="modalConfirm"
          class="px-4 py-2 rounded-lg bg-gradient-to-r from-yellow-400 to-pink-500 text-black font-semibold text-sm">Ya</button>
      </div>
    </div>
  </div>

  <script>
    class Pelanggan {
      constructor(nama, nomorTelepon, kendaraanDisewa) {
        this._id = Pelanggan.generateId();
        this.nama = nama;
        this.nomorTelepon = nomorTelepon;
        this.kendaraanDisewa = kendaraanDisewa;
        this.tanggalSewa = new Date().toLocaleString();
      }
      static generateId() {
        return 'PLG-' + Math.random().toString(36).slice(2, 9).toUpperCase();
      }
      getId() { return this._id; }
      toJSON() {
        return {
          id: this._id,
          nama: this.nama,
          nomorTelepon: this.nomorTelepon,
          kendaraanDisewa: this.kendaraanDisewa,
          tanggalSewa: this.tanggalSewa
        };
      }
      static fromJSON(obj) {
        const p = new Pelanggan(obj.nama, obj.nomorTelepon, obj.kendaraanDisewa);
        p._id = obj.id || p._id;
        p.tanggalSewa = obj.tanggalSewa || p.tanggalSewa;
        return p;
      }
    }

    class SistemManajemenTransportasi {
      constructor(storageKey = 'smt_data') {
        this.storageKey = storageKey;
        this.daftarPelanggan = [];
        this.load();
      }
      tambahPelanggan(pelanggan) {
        this.daftarPelanggan.push(pelanggan);
        this.save();
      }
      hapusPelangganById(id) {
        const idx = this.daftarPelanggan.findIndex(p => p.getId() === id);
        if (idx !== -1) {
          const removed = this.daftarPelanggan.splice(idx, 1)[0];
          this.save();
          return removed;
        }
        return null;
      }
      getPelangganSedangMenyewa() {
        return [...this.daftarPelanggan];
      }
      save() {
        localStorage.setItem(this.storageKey, JSON.stringify(this.daftarPelanggan.map(p => p.toJSON())));
      }
      load() {
        const raw = localStorage.getItem(this.storageKey);
        if (raw) {
          try { this.daftarPelanggan = JSON.parse(raw).map(a => Pelanggan.fromJSON(a)); }
          catch { this.daftarPelanggan = []; }
        }
      }
      clearAll() { this.daftarPelanggan = []; this.save(); }
    }

    const manager = new SistemManajemenTransportasi();
    const form = document.getElementById('form-sewa');
    const daftarEl = document.getElementById('daftar-pelanggan');
    const btnClear = document.getElementById('btn-clear');

    const modalOverlay = document.getElementById('modalOverlay');
    const modalTitle = document.getElementById('modalTitle');
    const modalMessage = document.getElementById('modalMessage');
    const modalConfirm = document.getElementById('modalConfirm');
    const modalCancel = document.getElementById('modalCancel');

    let confirmAction = null;

    function openModal(title, message, onConfirm) {
      modalTitle.textContent = title;
      modalMessage.textContent = message;
      confirmAction = onConfirm;
      modalOverlay.classList.remove('hidden');
    }

    function closeModal() {
      modalOverlay.classList.add('hidden');
      confirmAction = null;
    }

    modalCancel.addEventListener('click', closeModal);
    modalConfirm.addEventListener('click', () => {
      if (confirmAction) confirmAction();
      closeModal();
    });

    function renderList() {
      daftarEl.innerHTML = '';
      const list = manager.getPelangganSedangMenyewa();
      if (list.length === 0) {
        daftarEl.innerHTML = '<p class="text-sm text-gray-400">Belum ada pelanggan yang menyewa.</p>';
        return;
      }
      list.forEach(p => {
        const card = document.createElement('div');
        card.className = 'p-3 rounded-lg bg-white/10 border border-white/20 flex flex-col gap-2';
        card.innerHTML = `
          <div class="flex items-center justify-between">
            <div>
              <div class="text-base font-semibold text-white">${escapeHtml(p.nama)}</div>
              <div class="text-sm text-gray-300">${escapeHtml(p.kendaraanDisewa)} · ${escapeHtml(p.nomorTelepon)}</div>
              <div class="text-xs text-gray-400 mt-1">Mulai: ${escapeHtml(p.tanggalSewa)}</div>
            </div>
            <button data-id="${p.getId()}" 
              class="btn-selesai px-3 py-1 rounded-md text-sm font-medium text-white bg-gradient-to-r from-pink-500 to-yellow-400 hover:opacity-90 shadow">
              Selesai
            </button>
          </div>
        `;
        daftarEl.appendChild(card);
      });

      document.querySelectorAll('.btn-selesai').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const id = e.currentTarget.getAttribute('data-id');
          const pelanggan = manager.daftarPelanggan.find(p => p.getId() === id);

          openModal("Konfirmasi Pengembalian",
            `Apakah kendaraan dari ${escapeHtml(pelanggan.nama)} sudah dikembalikan?`,
            () => {
              const removed = manager.hapusPelangganById(id);
              renderList();
              if (removed) {
                const statusCard = document.createElement('div');
                statusCard.className = 'p-3 rounded-lg bg-green-800/30 border border-green-500/30 text-green-300 text-sm';
                statusCard.textContent = `✅ Kendaraan telah dikembalikan oleh ${removed.nama}`;
                daftarEl.prepend(statusCard);
              }
            });
        });
      });
    }

    const dropdownButton = document.getElementById('dropdownButton');
    const dropdownMenu = document.getElementById('dropdownMenu');
    const dropdownSelected = document.getElementById('dropdownSelected');
    const kendaraanInput = document.getElementById('kendaraan');

    dropdownButton.addEventListener('click', () => {
      dropdownMenu.classList.toggle('hidden');
    });

    dropdownMenu.querySelectorAll('li').forEach(item => {
      item.addEventListener('click', () => {
        const value = item.getAttribute('data-value');
        kendaraanInput.value = value;
        dropdownSelected.textContent = value;
        dropdownSelected.classList.remove('text-white', 'text-gray-400');
        dropdownMenu.classList.add('hidden');
      });
    });

    document.addEventListener('click', (e) => {
      if (!dropdownButton.contains(e.target) && !dropdownMenu.contains(e.target)) {
        dropdownMenu.classList.add('hidden');
      }
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const nama = document.getElementById('nama').value.trim();
      const nomor = document.getElementById('nomor').value.trim();
      const kendaraan = document.getElementById('kendaraan').value.trim();
      if (!nama || !nomor || !kendaraan) return;
      const p = new Pelanggan(nama, nomor, kendaraan);
      manager.tambahPelanggan(p);
      form.reset();
      renderList();
    });

    btnClear.addEventListener('click', () => {
      openModal("Konfirmasi Hapus Semua", "Apakah Anda yakin ingin menghapus semua data pelanggan?", () => {
        manager.clearAll();
        renderList();
      });
    });

    function escapeHtml(text) {
      return String(text).replace(/[&<>\"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": "&#39;" }[m]));
    }

    renderList();
  </script>
</body>

</html>
